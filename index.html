<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AimConfig</title>
<style>
body{margin:0;background:#0b0d12;color:white;font-family:Arial;text-align:center}
header{padding:25px;background:#151923}
h1{color:#ffd21c}
section{padding:30px 15px}
.card{background:#151923;padding:20px;margin:15px auto;border-radius:12px;max-width:400px}
button{background:#ffd21c;border:0;padding:12px 20px;border-radius:8px;font-weight:bold}
p{color:#bbb}
</style>
</head>
<body>

<header>
<h1>🎯 AimConfig</h1>
<p>PUBG Mobile Ayar Merkezi</p>
</header>

<section>
<h2>🎮 Ayarlarını Bul</h2>

<div class="card">
<h3>🎯 Hassasiyet Ayarları</h3>
<p>Cihazına uygun hassasiyet ayarlarını keşfet.</p>
<button>İncele</button>
</div>

<div class="card">
<h3>📱 Jiroskop Ayarları</h3>
<p>Jiroskop kullanan oyuncular için ayarlar.</p>
<button>İncele</button>
</div>

<div class="card">
<h3>🎮 HUD Ayarları</h3>
<p>2, 3 ve 4 parmak kontrol düzenleri.</p>
<button>İncele</button>
</div>

</section>

<footer>
<p>© 2026 AimConfig</p>
</footer>

</body>
</html>
